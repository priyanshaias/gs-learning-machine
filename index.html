:root{
  --ink:#191918;--ink-soft:#2a2926;--text-strong:#37352f;--text-body:#55534e;--text-subtle:#6b6a66;--text-faint:#8f8d88;
  --surface:#fff;--surface-inset:#fbfbfa;--surface-sidebar:#f8f8f7;--surface-muted:#f6f5f4;--surface-hover:#f3f2f0;--surface-sunken:#f1f0ee;
  --line:#ecebe8;--border:#e3e2df;--border-strong:#c9c7c2;--border-hover:#9d9b96;
  --primary:#0b66c3;--primary-hover:#0a579f;--primary-soft:#e8f1fc;--primary-soft-hover:#d8e8fa;--link:#0b5cad;--link-hover:#08467f;
  --prelims-soft:#dff3e2;--prelims:#2f9e44;--prelims-ink:#1d6b31;--mains-soft:#dfeafb;--mains:#2f6fdb;--mains-ink:#1f4f9e;
  --optional-soft:#fcebd9;--optional:#d9731a;--optional-ink:#8a4510;--ifos-soft:#dcefea;--ifos:#1f8a70;--ifos-ink:#155e4d;
  --interview-soft:#efe6fb;--interview:#7c4ddb;--interview-ink:#51308f;--danger:#c2410c;--highlight:#fff1b8;--note-paper:#fffdf6;--note-edge:#efe8d2;
  /* highlight fills: yellow = system highlight, green = prelims, purple = interview; pink is an extension (no pink in the system) */
  --hl-y:#ffec9e;--hl-g:#cfe9d5;--hl-p:#fbd5e3;--hl-v:#e4d8f8;
  --dot-y:#e0a800;--dot-g:#2f9e44;--dot-p:#d6336c;--dot-v:#7c4ddb;
  --sans:"Schibsted Grotesk","Helvetica Neue",Helvetica,sans-serif;--serif:Fraunces,Georgia,serif;
  --shadow-card:0 0 0 1px rgba(25,25,24,.05),0 12px 30px -16px rgba(25,25,24,.12);
  --shadow-stack:0 0 0 1px rgba(25,25,24,.06),0 10px 24px -14px rgba(25,25,24,.25);
  --shadow-window:0 30px 80px -20px rgba(25,25,24,.18),0 8px 20px -8px rgba(25,25,24,.08),0 1px 2px rgba(25,25,24,.05);
  --ease:cubic-bezier(.2,.8,.2,1);--size:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--text-strong);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--link);text-decoration:none}a:hover{color:var(--link-hover)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
::selection{background:#d8e8fa}
.num{font-variant-numeric:tabular-nums}
/* header */
#hdr{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap}
.logo i{font:700 17px/1 var(--serif);font-style:normal;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:7px;box-shadow:2px 2px 0 var(--ink);background:#fff}
.sp{flex:1}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-subtle);min-width:0}
.crumb b{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--text-faint);white-space:nowrap;transition:opacity .4s}
.btn{height:36px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.btn.pri{background:var(--primary);color:#fff}.btn.pri:hover{background:var(--primary-hover)}
.btn.soft{background:var(--primary-soft);color:var(--link)}.btn.soft:hover{background:var(--primary-soft-hover)}
.btn.out{border:1px solid var(--border);background:#fff;color:var(--text-strong)}.btn.out:hover{border-color:var(--border-hover)}
.btn.ghost{color:var(--text-body)}.btn.ghost:hover{background:var(--surface-hover);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn svg,.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--text-body)}
.ib:hover,.ib.on{background:var(--surface-hover);color:var(--ink)}
.eyebrow{font-size:13px;font-weight:600;color:var(--text-subtle)}
/* library */
.wrap{max-width:1240px;margin:0 auto;padding:0 32px 96px}
.hero{padding:72px 0 40px;max-width:640px;animation:up .45s var(--ease)}
.hero h1{font-size:44px;line-height:1.06;font-weight:900;letter-spacing:-.04em;color:var(--ink);margin:10px 0 14px}
.hero p{font-size:18px;line-height:1.55;color:var(--text-body);margin:0}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.sh{display:flex;align-items:baseline;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:56px 0 16px}
.sh span{font-size:13px;font-weight:600;color:var(--text-faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.bcard{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;color:inherit;transition:border-color .2s,box-shadow .25s,transform .25s var(--ease);animation:up .45s var(--ease) backwards}
.bcard:hover{color:inherit;border-color:var(--border-hover);box-shadow:var(--shadow-card);transform:translateY(-2px)}
.cover{height:190px;padding:22px 22px 18px;display:flex;flex-direction:column;justify-content:space-between;background:var(--cs);color:var(--ci)}
.cover .ct{font-size:27px;line-height:1.06;font-weight:900;letter-spacing:-.035em}
.cover .ca{font-size:13px;font-weight:600;opacity:.85}
.bmeta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.bmeta .sub{font-size:13.5px;color:var(--text-body);line-height:1.45}
.bmeta .st{font-size:12.5px;color:var(--text-faint)}
.track{height:4px;border-radius:2px;background:var(--surface-sunken);overflow:hidden}.track i{display:block;height:100%;background:var(--prelims);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:24px;padding:0 9px;border-radius:999px;background:var(--surface-sunken);font-size:12px;font-weight:600;color:var(--text-body);display:inline-flex;align-items:center;gap:6px}
.chip.none{background:none;border:1px dashed var(--border-strong);color:var(--text-faint)}
.ktable{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.krowt{display:grid;grid-template-columns:1.3fr 1.4fr 1.2fr .8fr 24px;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);color:inherit;font-size:14px;transition:background .15s}
.krowt:last-child{border-bottom:0}.krowt:hover{background:var(--surface-inset);color:inherit}
.krowt.head{font-size:12px;font-weight:600;color:var(--text-faint);padding:10px 18px;background:var(--surface-inset)}
.krowt.head:hover{background:var(--surface-inset)}
.kname{font-weight:700;color:var(--ink)}
.counts{display:flex;gap:12px;font-size:12.5px;color:var(--text-body)}
.counts span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--d);display:inline-block;flex:none}
.foot{margin-top:40px;padding:20px 22px;border-radius:14px;background:var(--surface-muted);font-size:14px;color:var(--text-body);line-height:1.6}
.foot code{font-size:12.5px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--ink)}
/* connect screen */
.connect{max-width:560px;margin:12vh auto 0;padding:0 24px;text-align:left;animation:up .45s var(--ease)}
.connect h1{font-size:44px;line-height:1.06;font-weight:900;letter-spacing:-.04em;color:var(--ink);margin:18px 0 14px}
.connect p{font-size:16px;color:var(--text-body);margin:0 0 22px;line-height:1.6}
.connect .tree{font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-muted);border-radius:12px;padding:14px 18px;color:var(--text-body);margin:0 0 24px;white-space:pre-wrap;overflow-wrap:anywhere}
.connect .row{display:flex;gap:10px;flex-wrap:wrap}
/* reader layout */
.rd{--l:260px;--r:360px;display:grid;grid-template-columns:var(--l) minmax(0,1fr) var(--r);min-height:calc(100vh - 56px)}
.rd.notoc{--l:0px}.rd.nopanel{--r:0px}
.toc{grid-column:1}.center{grid-column:2;grid-row:1}.kp{grid-column:3;grid-row:1}.rd.notoc .toc{display:none}
.toc{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;background:var(--surface-sidebar);border-right:1px solid var(--line);padding:22px 12px 40px}
.toc .bt{display:flex;gap:6px;align-items:flex-start;padding:0 4px 16px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.toc .bt b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.toc .bt span{font-size:12.5px;color:var(--text-subtle)}
.toc a{display:flex;gap:8px;padding:6px 10px;border-radius:7px;font-size:13.5px;line-height:1.35;color:var(--text-body)}
.toc a:hover{background:var(--surface-hover);color:var(--ink)}
.toc a.cur{background:var(--surface-sunken);color:var(--ink);font-weight:600}

    ${hidK.length?`<button class="hidlink" id="kpHid">${showHid?'Hide':'Show'} ${hidK.length} hidden knowte${hidK.length>1?'s':''}</button>${showHid?hidK.map(k=>`<div class="krow hid"><div class="kt"><b>${esc(k.data.name)}</b><small class="num">${k.data.highlights.length} highlights · hidden</small></div><button class="btn sm ghost" data-unhide="${esc(k.data.name)}">Unhide</button><button class="ib" data-menu="${esc(k.data.name)}" title="More">${ICON.more}</button></div>`).join(''):''}`:''}
    <div class="kacts"><button class="btn sm pri" id="newK">New knowte</button>${ACT?`<button class="btn sm soft" id="saveAs">Save ${esc(ACT)} as…</button>`:''}</div>${migBox()}`;
    $$('[data-vis]',B).forEach(x=>{const f=()=>{const n=x.dataset.vis;if(VIS.includes(n)){VIS=VIS.filter(y=>y!==n);if(ACT===n)ACT=VIS[0]||null}else{VIS.push(n);if(!ACT)ACT=n}saveVis();renderAll();renderPanel()};x.onclick=f;x.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();f()}}});
    $$('[data-act]',B).forEach(x=>x.onclick=()=>{const n=x.dataset.act;if(!VIS.includes(n))VIS.push(n);ACT=n;saveVis();renderAll();renderPanel()});
    $$('[data-menu]',B).forEach(x=>x.onclick=e=>{e.stopPropagation();$$('.float.menu').forEach(m=>m.remove());const k=K(x.dataset.menu);const m=document.createElement('div');m.className='float menu';
      m.innerHTML=`<button data-m="dup">Duplicate as…</button><button data-m="md">Export to Markdown</button><button data-m="json">Download file</button><hr><button data-m="hide">${k.data.hidden?'Unhide':'Hide from list'}</button><button data-m="del" class="danger">Delete…</button>`;
      m.onclick=ev=>{const a=ev.target.closest('[data-m]');if(!a)return;m.remove();const t=a.dataset.m;if(t==='dup')saveAs(k);if(t==='md')exportMD(k);if(t==='json')download(k.file,JSON.stringify(k.data,null,1),'application/json');if(t==='hide')hideKnote(k,!k.data.hidden);if(t==='del')deleteKnote(k)};
      const r=x.getBoundingClientRect();document.body.appendChild(m);m.style.top=(r.bottom+scrollY+6)+'px';m.style.left=(r.right-m.offsetWidth+scrollX)+'px'});
    const kh=$('#kpHid');if(kh)kh.onclick=()=>{showHid=!showHid;renderPanel()};
    $$('[data-unhide]',B).forEach(x=>x.onclick=()=>hideKnote(K(x.dataset.unhide),false));
    $('#newK').onclick=async()=>{const n=await nameAsk('New knowte','An empty set of highlights and notes for this book.',suggestName());if(n)newKnote(n,[])};
    const sa=$('#saveAs');if(sa)sa.onclick=()=>saveAs(K(ACT));
    const mi=$('#migGo');if(mi)mi.onclick=migrate;const md=$('#migNo');if(md)md.onclick=()=>{pref('mig:'+BK.id,1);renderPanel()}}
  else{const all=visK().flatMap(k=>k.data.highlights.filter(h=>P[h.pid]).map(h=>({h,k}))).sort((a,b)=>P[a.h.pid].w0-P[b.h.pid].w0||a.h.s-b.h.s);
    let list=all.filter(x=>filt==='all'||x.h.c===filt||(filt==='n'&&x.h.note&&x.h.note.trim()));if(q)list=list.filter(x=>(x.h.text+' '+(x.h.note||'')).toLowerCase().includes(q.toLowerCase()));
    const multi=visK().length>1;let h=`<div class="filters">${[['all','All'],...ORDER.map(c=>[c,COL[c].label]),['n','With notes']].map(([k,l])=>`<button class="fchip ${filt===k?'on':''}" data-f="${k}">${COL[k]?`<i class="dot" style="--d:${COL[k].d}"></i>`:''}${l}</button>`).join('')}</div><input class="search" id="q" placeholder="Search highlights and notes" value="${esc(q)}">`;
    if(!visK().length)h+='<div class="empty"><b>Nothing ticked</b>Tick a knowte to see its highlights here.</div>';else if(!list.length)h+='<div class="empty"><b>No matches</b>Try another filter.</div>';
    let lc=-1;list.slice(0,600).forEach(({h:x,k})=>{const ci=P[x.pid].ci;if(ci!==lc){lc=ci;const n=list.filter(y=>P[y.h.pid].ci===ci).length;h+=`<div class="grp"><span style="color:var(--text-subtle);font-weight:700">${esc(CH[ci].label)}</span><span>${n}</span></div>`}
      h+=`<div class="item" data-id="${x.id}" style="--d:${COL[x.c].d}"><div class="q ${x.c==='v'?'term':''}">${x.c==='v'?esc(x.text.trim()):'“'+esc(x.text)+'”'}</div>${x.note&&x.note.trim()?`<div class="nt">${esc(x.note)}</div>`:''}<div class="m">${COL[x.c].label} · p. ${pageOf(x.pid)}${multi?' · '+esc(k.data.name):''}</div></div>`});
    if(list.length>600)h+=`<div class="empty">Showing the first 600 of ${list.length}. Use a filter or search.</div>`;
    B.innerHTML=h;$$('[data-f]',B).forEach(b=>b.onclick=()=>{filt=b.dataset.f;renderPanel()});
    const qi=$('#q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;renderPanel();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
    $$('.item',B).forEach(it=>it.onclick=()=>{const f=findH(it.dataset.id);if(!f)return;const el=paraEl[f.h.pid];scrollTo({top:el.getBoundingClientRect().top+scrollY-140,behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(()=>openPop(f.h.id),650)})}}

/* one-time import of notes made in the old single-file version (same browser) */
function oldState(){try{const s=JSON.parse(localStorage.getItem('gslm:'+BK.id)||'null');return s&&s.hl&&Object.keys(s.hl).length?s:null}catch(e){return null}}
function migBox(){if(pref('mig:'+BK.id))return'';const s=oldState();if(!s)return'';const n=Object.keys(s.hl).length;
  return `<div class="mig">This browser still holds ${n} highlights from the old single-file Learning Machine.<div class="row"><button class="btn sm pri" id="migGo">Import as a knowte</button><button class="btn sm ghost" id="migNo">Dismiss</button></div></div>`}
async function migrate(){const s=oldState();if(!s)return;const name=await nameAsk('Import old highlights','They become a new knowte. Nothing is deleted.',suggestName('gs_'+slug()+'_old'));if(!name)return;
  const hls=Object.values(s.hl).map(h=>({id:uid(),pid:h.pid,s:h.s,e:h.e,c:h.c,text:h.text,note:h.note||'',t:new Date(h.t||Date.now()).toISOString()}));const cn={};Object.entries(s.chap||{}).forEach(([k,v])=>{const t=[v.sum,v.th].filter(Boolean).join('\n\n');if(t)cn[k]=t});
  pref('mig:'+BK.id,1);newKnote(name,hls,cn)}

/* ---------- reading position ---------- */
let scT;addEventListener('scroll',()=>{if(!BK)return;clearTimeout(scT);scT=setTimeout(()=>{const y=innerHeight*.3;let best=null;for(const el of Object.values(paraEl)){if(el.getBoundingClientRect().top<=y)best=el;else break}
  if(!best)return;const p=P[best.dataset.pid];const pct=Math.round((p.w0+p.w)/TOTALW*100);pref('pos:'+BK.id,{pid:p.pid,pct});const pe=$('#pct');if(pe)pe.textContent=`p. ${pageOf(p.pid)} · ${pct}%`;
  $$('#toc a').forEach((a,ci)=>a.classList.toggle('cur',ci===p.ci))},150)},{passive:true});
addEventListener('beforeunload',e=>{if(LIB.knotes.some(k=>k.dirty)){flushAll();e.preventDefault();e.returnValue=''}});

boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
